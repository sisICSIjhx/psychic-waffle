name: reportes-icsi-local

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.006
    ports:
      - '127.0.0.1:55322:5432'
    environment:
      POSTGRES_PASSWORD: ${REPORTES_POSTGRES_PASSWORD:?Ejecute el script de inicio local}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./roles.local.sql:/docker-entrypoint-initdb.d/zz-reportes-roles.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 60

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${REPORTES_POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${REPORTES_JWT_SECRET}

  gateway:
    image: public.ecr.aws/supabase/kong:2.8.1
    ports:
      - '127.0.0.1:55321:8000'
    depends_on:
      - rest
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/local.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_NGINX_WORKER_PROCESSES: '1'
    volumes:
      - ./gateway.local.yml:/etc/kong/local.yml:ro

  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.100.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_DB_HOST: db
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${REPORTES_POSTGRES_PASSWORD}

  studio:
    image: public.ecr.aws/supabase/studio:2026.10.19-sha-b375769
    ports:
      - '127.0.0.1:55323:3000'
    depends_on:
      - meta
      - gateway
    environment:
      HOSTNAME: 0.0.0.0
      DEFAULT_PROJECT_NAME: Reportes ICSI
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${REPORTES_POSTGRES_PASSWORD}
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${PUBLIC_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${REPORTES_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${REPORTES_JWT_SECRET}
      PGRST_DB_SCHEMAS: public

volumes:
  db-data:
